<div class="flex h-screen bg-slate-50 dark:bg-slate-900 overflow-hidden">
    <!-- Sidebar (Only visible when logged in) -->
    <app-sidebar *ngIf="authService.currentUser$ | async" [class.hidden]="!sidebarOpen" class="lg:block"
        [class.lg:w-64]="true" [class.fixed]="true" [class.lg:relative]="true" [class.z-50]="true"></app-sidebar>

    <!-- Overlay for mobile (Only visible when logged in) -->
    <div *ngIf="(authService.currentUser$ | async) && sidebarOpen" (click)="toggleSidebar()"
        class="fixed inset-0 bg-black bg-opacity-50 lg:hidden z-40">
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Header with Hamburger Menu (Only visible when logged in) -->
        <header *ngIf="authService.currentUser$ | async" class="bg-white dark:bg-slate-800 shadow-sm z-30 border-b border-gray-100 dark:border-slate-700">
            <div class="flex items-center justify-between p-4">
                <button (click)="toggleSidebar()"
                    class="lg:hidden p-2 rounded-md text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div class="flex-1 lg:ml-0 ml-4">
                    <h1 class="text-xl font-bold text-gray-900 dark:text-white">QuarkBau Management System</h1>
                </div>

                <button (click)="logout()"
                    class="ml-4 px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 border border-red-200">
                    <span>🚪</span>
                    <span class="hidden sm:inline">Logout</span>
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 dark:bg-slate-900 flex flex-col">
            <div class="flex-grow">
                <router-outlet></router-outlet>
            </div>
            <app-footer></app-footer>
        </main>
    </div>
    <app-toast></app-toast>
</div>
