<div class="flex h-screen bg-[#0d0e11] text-white/80 overflow-hidden font-sans">
    <!-- Sidebar -->
    <app-sidebar *ngIf="authService.currentUser$ | async" [class.hidden]="!sidebarOpen" class="lg:block border-r border-white/5 transition-all duration-300 relative"
        [class.lg:w-64]="!sidebarCollapsed" [class.lg:w-4]="sidebarCollapsed" [class.fixed]="true" [class.lg:relative]="true" [class.z-50]="true"
        (collapsedChange)="onSidebarCollapse($event)" [isCollapsed]="sidebarCollapsed"></app-sidebar>

    <!-- Overlay for mobile -->
    <div *ngIf="(authService.currentUser$ | async) && sidebarOpen" (click)="toggleSidebar()"
        class="fixed inset-0 bg-[#0d0e11]/80 backdrop-blur-sm lg:hidden z-40">
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Top Header -->
        <header *ngIf="authService.currentUser$ | async" class="bg-[#131415]/80 backdrop-blur-md z-30 border-b border-white/5 relative h-[80px] flex items-center">
            <div class="flex items-center justify-between w-full px-4 lg:px-6">
                <button (click)="toggleSidebar()"
                    class="lg:hidden p-2 rounded-md text-white/50 hover:bg-white/5 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div class="flex-1 lg:ml-0 ml-4 flex items-center gap-3">
                    <h1 class="font-mono text-[11px] uppercase tracking-widest text-white/40">QuarkBau / Management System</h1>
                    <span class="px-2 py-0.5 rounded bg-[#2fb080]/10 border border-[#2fb080]/20 text-[#2fb080] font-mono text-[9px] uppercase tracking-widest hidden sm:block">Online</span>
                </div>

                <div class="flex items-center gap-4 ml-4">
                    <!-- Notifications Dropdown -->
                    <div class="relative">
                        <button (click)="toggleNotifications()" class="relative p-2 text-white/50 hover:text-white transition-colors rounded-full hover:bg-white/5">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                            </svg>
                            <span *ngIf="(sseNotificationService.unreadCount$ | async)! > 0" class="absolute top-1 right-1 flex h-3 w-3 items-center justify-center rounded-full bg-red-500 text-[8px] font-bold text-white">
                                {{ sseNotificationService.unreadCount$ | async }}
                            </span>
                        </button>
                        
                        <!-- Dropdown Panel -->
                        <div *ngIf="showNotifications" class="absolute right-0 mt-2 w-80 bg-[#16171a] border border-white/10 rounded-xl shadow-2xl z-50 overflow-hidden">
                            <div class="p-4 border-b border-white/5 bg-[#0d0e11]/50">
                                <h3 class="text-xs font-mono uppercase tracking-widest text-white/70">Command Center Logs</h3>
                            </div>
                            <div class="max-h-96 overflow-y-auto">
                                <div *ngIf="(sseNotificationService.notifications$ | async)?.length === 0" class="p-8 text-center text-white/30 text-xs font-mono uppercase tracking-widest">
                                    No activity detected
                                </div>
                                <div *ngFor="let msg of sseNotificationService.notifications$ | async" class="p-4 border-b border-white/5 hover:bg-white/5 transition-colors group cursor-pointer">
                                    <div class="flex justify-between items-start mb-2">
                                        <span class="text-xs font-bold text-white font-mono uppercase tracking-wider">{{ msg.title }}</span>
                                        <span class="text-[9px] px-1.5 py-0.5 rounded border border-blue-500/30 text-blue-400 font-mono tracking-widest bg-blue-500/10">UPDATE</span>
                                    </div>
                                    <p class="text-xs text-white/60 leading-relaxed mb-2">{{ msg.body }}</p>
                                    <div class="text-[9px] text-white/30 font-mono tracking-widest">
                                        {{ msg.timestamp | date:'HH:mm - dd/MM' }}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Logout Button -->
                    <button (click)="logout()"
                        class="px-3 py-1.5 bg-transparent hover:bg-white/5 text-white/50 hover:text-white rounded-lg text-[10px] font-mono uppercase tracking-widest transition-colors flex items-center gap-2 border border-white/5">
                        <span class="hidden sm:inline">Logout &rarr;</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-transparent flex flex-col relative z-10">
            <div class="flex-grow">
                <router-outlet></router-outlet>
            </div>
            <app-footer></app-footer>
        </main>
        
        <!-- Optional global background decoration -->
        <div class="fixed inset-0 pointer-events-none z-0 bg-[radial-gradient(ellipse_at_top,rgba(47,176,128,0.03)_0%,transparent_50%)]"></div>
    </div>
    <app-toast></app-toast>
</div>
