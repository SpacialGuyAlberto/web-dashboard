<aside
    class="w-64 bg-gray-900 border-r border-gray-800 text-gray-300 flex flex-col h-full bg-opacity-95 backdrop-blur-xl transition-all duration-300">
    <!-- Brand -->
    <div class="p-6 border-b border-gray-800/50">
        <div class="flex items-center gap-3">
            <div class="relative w-8 h-8 flex items-center justify-center">
                <div class="absolute inset-0 bg-blue-500 rounded-lg opacity-20 animate-pulse"></div>
                <div
                    class="w-8 h-8 bg-gradient-to-br from-blue-600 to-cyan-500 rounded-lg flex items-center justify-center font-bold text-white shadow-lg glow-sm">
                    Q</div>
            </div>
            <span class="text-xl font-bold tracking-tight text-white">QuarkBau</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto scrollbar-thin scrollbar-thumb-gray-700">
        <ng-container *ngFor="let item of filteredGroups">

            <!-- Single Item -->
            <a *ngIf="!item.children" [routerLink]="item.route"
                routerLinkActive="bg-blue-600/10 text-blue-400 border-l-2 border-blue-500"
                [routerLinkActiveOptions]="{exact: item.route === '/'}"
                class="flex items-center gap-3 px-3 py-2.5 rounded-r-lg hover:bg-gray-800/50 hover:text-white transition-all cursor-pointer group mb-1 border-l-2 border-transparent">
                <span class="group-hover:scale-110 transition-transform">{{ item.icon }}</span>
                <span class="font-medium text-sm">{{ item.label }}</span>
            </a>

            <!-- Group Item -->
            <div *ngIf="item.children" class="mb-2">
                <button (click)="toggleGroup(item)"
                    class="w-full flex items-center justify-between px-3 py-2.5 text-gray-400 hover:text-white hover:bg-gray-800/30 rounded-lg transition-colors group">
                    <div class="flex items-center gap-3">
                        <span class="group-hover:text-blue-400 transition-colors">{{ item.icon }}</span>
                        <span class="font-medium text-sm">{{ item.label }}</span>
                    </div>
                    <svg [class.rotate-180]="item.isOpen"
                        class="w-4 h-4 transition-transform duration-200 opacity-50 group-hover:opacity-100" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>

                <!-- Submenu -->
                <div *ngIf="item.isOpen" class="mt-1 ml-4 pl-3 border-l border-gray-800 space-y-1 animate-fade-in-down">
                    <a *ngFor="let child of item.children" [routerLink]="child.route"
                        routerLinkActive="text-blue-400 bg-blue-500/5"
                        class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:text-white hover:bg-gray-800/50 transition-all cursor-pointer">
                        <span class="text-xs opacity-70">{{ child.icon }}</span>
                        <span>{{ child.label }}</span>
                    </a>
                </div>
            </div>

        </ng-container>
    </nav>

    <!-- User & Actions -->
    <div class="p-4 border-t border-gray-800/50 bg-gray-900/50">
        <div *ngIf="currentUser" class="mb-4 px-2">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded-full bg-gradient-to-tr from-purple-500 to-indigo-500 flex items-center justify-center text-xs font-bold text-white">
                    {{ currentUser.firstName.charAt(0) }}{{ currentUser.lastName.charAt(0) }}
                </div>
                <div class="overflow-hidden">
                    <div class="text-sm font-medium text-white truncate">{{ currentUser.firstName }} {{
                        currentUser.lastName }}</div>
                    <div class="text-xs text-blue-400 truncate">{{ currentUser.role }}</div>
                </div>
            </div>
        </div>

        <button (click)="logout()"
            class="w-full flex items-center gap-3 px-3 py-2 text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-lg transition-colors text-sm font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                </path>
            </svg>
            Logout
        </button>

        <button (click)="toggleTheme()"
            class="w-full mt-2 flex items-center justify-center gap-2 px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white rounded-lg transition-colors text-xs">
            <span *ngIf="!isDarkMode">🌙</span>
            <span *ngIf="isDarkMode">☀️</span>
            <span>{{ isDarkMode ? 'Light Mode' : 'Dark Mode' }}</span>
        </button>
    </div>
</aside>
