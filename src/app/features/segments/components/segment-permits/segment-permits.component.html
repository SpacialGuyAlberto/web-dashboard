<div class="permits-container pb-12">
  <!-- Upload Zone -->
  <div class="upload-zone" (click)="fileInput.click()">
    <input type="file" #fileInput (change)="onFileSelected($event)" accept="application/pdf" style="display: none">
    <div *ngIf="!uploading">
      <svg class="w-8 h-8 mx-auto text-white/30 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
      <p class="text-white/60 text-[11px] font-mono uppercase tracking-widest">Click to upload PDF Permit</p>
    </div>
    <div *ngIf="uploading" class="flex flex-col items-center w-full max-w-[240px] mx-auto">
      <div class="spinner mb-3"></div>
      <div class="w-full bg-white/10 rounded-full h-1.5 mb-2 overflow-hidden">
        <div class="bg-[#6938ef] h-1.5 rounded-full transition-all duration-300 ease-out" [style.width.%]="uploadProgress"></div>
      </div>
      <p class="text-white/60 text-[11px] font-mono uppercase tracking-widest">Uploading... {{uploadProgress}}%</p>
    </div>
  </div>
  
  <div *ngIf="error" class="text-red-400 text-xs mt-2 font-mono">{{error}}</div>

  <!-- Permits List -->
  <div *ngIf="loading" class="text-white/40 text-xs font-mono mt-4">Loading permits...</div>
  
  <div class="grid grid-cols-2 gap-4 mt-4" *ngIf="!loading">
    @for (permit of permits; track permit.id) {
      <div class="bg-black/30 border border-white/10 rounded-xl p-4 flex flex-col gap-2 relative group hover:border-white/30 transition-all">
        <a [href]="permit.pdfUrl" target="_blank" class="absolute top-3 right-3 text-white/20 hover:text-white transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        </a>
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-blue-500/20 text-blue-400 border border-blue-500/30 rounded-lg flex items-center justify-center font-bold text-[10px]">PDF</div>
          <div class="flex flex-col overflow-hidden w-[70%]">
            <span class="text-xs text-white/90 truncate font-mono" [title]="permit.name">{{permit.name}}</span>
            <span class="text-[9px] text-white/40 font-mono tracking-widest uppercase mt-0.5">{{permit.createdAt | date:'shortDate'}}</span>
          </div>
        </div>
        @if (permit.previewImageUrl) {
          <div class="w-full h-24 mt-2 bg-black/60 rounded-lg overflow-hidden border border-white/5 relative">
             <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent z-10 pointer-events-none"></div>
             <img [src]="permit.previewImageUrl" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity duration-300">
             <span class="absolute bottom-2 left-2 z-20 text-[8px] text-white/50 font-mono uppercase tracking-widest bg-black/50 px-2 py-0.5 rounded">Preview Generated</span>
          </div>
        }
      </div>
    }
    @empty {
      <div class="col-span-2 text-white/20 text-xs font-mono uppercase tracking-widest text-center py-6 border border-dashed border-white/10 rounded-xl bg-black/20">
        No permits uploaded yet.
      </div>
    }
  </div>
</div>
