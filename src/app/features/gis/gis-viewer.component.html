<div class="h-full flex flex-col bg-[#0a0a0c]">
    <!-- Header/Toolbar -->
    <div class="p-6 bg-[#131415] border-b border-white/5 flex flex-col md:flex-row justify-between items-start md:items-center shadow-lg z-10 gap-4">
        <div class="flex items-center gap-6">
            <h1 class="font-display text-4xl font-normal text-white/90 tracking-tight leading-none flex items-center gap-3">
                <span class="text-[#6938ef] text-3xl">🌐</span> Digital Plan Room
            </h1>
            <div class="h-8 w-px bg-white/10 hidden md:block"></div>
            <div class="flex flex-col">
                <label class="text-[9px] font-mono text-white/30 uppercase tracking-[0.2em] mb-1">Select Project</label>
                <select (change)="onProjectSelect($event)"
                    class="bg-[#0a0a0c] text-white/80 font-mono text-xs border border-white/5 rounded-md px-3 py-2 focus:ring-1 focus:ring-[#6938ef]/50 focus:border-[#6938ef]/50 transition-all outline-none">
                    <option *ngFor="let p of projects" [value]="p.id">{{p.name}}</option>
                </select>
            </div>
        </div>
        <div class="flex gap-2">
            <button (click)="togglePlanOverlay(!showPlanOverlay)" [class.bg-[#6938ef]]="showPlanOverlay" [class.text-white]="showPlanOverlay"
                [class.bg-[#161719]]="!showPlanOverlay" [class.text-white/60]="!showPlanOverlay"
                class="px-6 py-3 rounded border border-white/5 font-mono text-[10px] uppercase tracking-widest transition-colors hover:bg-white/5">
                {{ showPlanOverlay ? 'Hide Utility Plans' : 'Show Utility Plans' }}
            </button>
        </div>
    </div>

    <!-- Map Container -->
    <div class="flex-1 relative">
        <div *ngIf="isLoading"
            class="absolute inset-0 z-20 flex items-center justify-center bg-[#0a0a0c]/80 backdrop-blur-sm transition-opacity duration-500">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-[#6938ef]"></div>
        </div>

        <google-map height="100%" width="100%" [center]="center" [zoom]="zoom" [options]="mapOptions"
            class="block w-full h-full">
            <!-- Ground Overlay for Utility Plan -->
            <map-ground-overlay *ngIf="showPlanOverlay" [url]="planUrl" [bounds]="planBounds"
                [clickable]="false"></map-ground-overlay>
        </google-map>

        <!-- Legend Overlay -->
        <div
            class="absolute bottom-8 right-8 p-6 bg-[#131415]/95 backdrop-blur-md rounded-xl border border-white/5 shadow-2xl max-w-xs z-10">
            <h3 class="text-[9px] font-mono text-[#6938ef] uppercase tracking-[0.2em] mb-4 flex items-center gap-3">
                Utility Legend
                <div class="h-[1px] flex-1 bg-white/5"></div>
            </h3>
            <div class="space-y-4">
                <div class="flex items-center gap-4">
                    <div class="w-8 h-1 bg-red-400"></div>
                    <span class="font-mono text-[10px] text-white/60 uppercase tracking-widest">Gas Lines (Vattenfall)</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-8 h-1 bg-blue-400"></div>
                    <span class="font-mono text-[10px] text-white/60 uppercase tracking-widest">Water Main (Berlin Wasser)</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-8 h-1 bg-[#6938ef]"></div>
                    <span class="font-mono text-[10px] text-white/60 uppercase tracking-widest">Fiber Optic (Telekom)</span>
                </div>
            </div>
            <div class="mt-6 pt-4 border-t border-white/5">
                <p class="font-mono text-[9px] text-white/30 uppercase tracking-[0.2em] leading-relaxed">
                    Source: Combined VZ/GisData Infrastructure Feed (Updated 2026)
                </p>
            </div>
        </div>
    </div>
</div>
