<div class="login-container">
    <!-- Left Side: Hero Image & Branding (Hidden on mobile) -->
    <div class="hero-section">
        <div class="hero-bg-image" style="background-image: url('/assets/fiber-hero.png');"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>
                Construyendo el futuro<br>
                <span>con precisión.</span>
            </h1>
            <p class="hero-description">
                Gestión integral de obras, planificación inteligente y seguridad avanzada en una sola plataforma.
            </p>
            <div class="hero-indicators">
                <div class="indicator-main"></div>
                <div class="indicator-alt"></div>
                <div class="indicator-alt"></div>
            </div>
        </div>
    </div>

    <!-- Right Side: Login Form with Glassmorphism -->
    <div class="login-form-area">
        <!-- Vibrant Background Layer -->
        <div class="vibrant-bg-layer">
            <div class="bg-image-dimmed" style="background-image: url('/assets/fiber-cables.png');"></div>
            <div class="bg-gradient-radial"></div>
        </div>

        <!-- Glass Login Card -->
        <div class="login-card">
            <!-- Header -->
            <div class="card-header">
                <div class="icon-wrapper">
                    <svg class="brand-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                        </path>
                    </svg>
                </div>
                <h2 class="brand-title">
                    <span class="title-gradient">Horizon Link</span>
                </h2>
                <p class="card-subtitle">
                    Accede a tu panel de control
                </p>
            </div>

            <form class="form-group-list" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="space-y-4">
                    <!-- Email Input -->
                    <div class="form-field">
                        <label for="email-address" class="field-label">Email</label>
                        <div class="input-container">
                            <div class="input-icon-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2001/svg" viewBox="0 0 20 20"
                                    fill="currentColor">
                                    <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                                    <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                                </svg>
                            </div>
                            <input id="email-address" type="email" formControlName="email" class="form-input"
                                placeholder="tu@email.com"
                                [ngClass]="{ 'input-error': submitted && f['email'].errors }">
                        </div>
                        <div *ngIf="submitted && f['email'].errors" class="error-text">
                            <span *ngIf="f['email'].errors['required']">Campo requerido</span>
                            <span *ngIf="f['email'].errors['email']">Email inválido</span>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="form-field">
                        <label for="password" class="field-label">Contraseña</label>
                        <div class="input-container">
                            <div class="input-icon-wrapper">
                                <svg class="input-icon" xmlns="http://www.w3.org/2001/svg" viewBox="0 0 20 20"
                                    fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                        clip-rule="evenodd" />
                                </svg>
                            </div>
                            <input id="password" type="password" formControlName="password" class="form-input"
                                placeholder="••••••••" [ngClass]="{ 'input-error': submitted && f['password'].errors }">
                        </div>
                        <div *ngIf="submitted && f['password'].errors" class="error-text">
                            <span *ngIf="f['password'].errors['required']">Campo requerido</span>
                        </div>
                    </div>
                </div>

                <div class="form-options">
                    <div class="remember-me-container">
                        <input id="remember-me" name="remember-me" type="checkbox" class="checkbox-control">
                        <label for="remember-me" class="checkbox-label">Recordarme</label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="forgot-password-link">
                            ¿Recuperar clave?
                        </a>
                    </div>
                </div>

                <!-- Error Message -->
                <div *ngIf="error" class="server-error-banner" role="alert">
                    <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>{{ error }}</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" [disabled]="loginForm.invalid || loading" class="btn-submit group">
                    <span class="btn-icon-container">
                        <svg *ngIf="!loading" class="btn-icon" xmlns="http://www.w3.org/2001/svg" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                clip-rule="evenodd" />
                        </svg>
                        <svg *ngIf="loading" class="spinner" xmlns="http://www.w3.org/2001/svg" fill="none"
                            viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </span>
                    {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
                </button>

                <div class="form-footer">
                    <p class="footer-text">
                        ¿Nuevo usuario?
                        <a routerLink="/register" class="footer-link">
                            Crear cuenta
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
