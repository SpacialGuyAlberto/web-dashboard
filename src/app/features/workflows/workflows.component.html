<div class="workflows-container">
    <div class="max-container">
        <!-- Header -->
        <div class="page-header">
            <h1 class="header-title">Workflows</h1>
            <p class="header-subtitle">Track deployment workflow progress</p>
        </div>

        <!-- Workflows Table -->
        <div class="table-wrapper">
            <table class="data-table">
                <thead class="thead-light">
                    <tr>
                        <th class="table-th">Project</th>
                        <th class="table-th">Current Step</th>
                        <th class="table-th">Assigned To</th>
                        <th class="table-th">Status</th>
                        <th class="table-th">Due Date</th>
                        <th class="table-th">Actions</th>
                    </tr>
                </thead>
                <tbody class="tbody-main">
                    <tr *ngFor="let workflow of workflows" class="table-row-hover">
                        <td class="table-td">
                            <div class="projectName-cell">{{ workflow.projectName }}</div>
                        </td>
                        <td class="table-td">
                            <div class="currentStep-cell">{{ workflow.currentStep }}</div>
                        </td>
                        <td class="table-td">
                            <div class="assignedTo-cell">{{ workflow.assignedTo }}</div>
                        </td>
                        <td class="table-td">
                            <span [class]="getStatusColor(workflow.status)" class="status-badge">
                                {{ getStatusText(workflow.status) }}
                            </span>
                        </td>
                        <td class="table-td">
                            <div class="dueDate-cell">{{ workflow.dueDate }}</div>
                        </td>
                        <td class="table-td actions-cell">
                            <button class="btn-view">View</button>
                            <button (click)="openEditModal(workflow)" class="btn-edit-action">Edit</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Add Workflow Button -->
        <div class="footer-actions">
            <button (click)="openCreateModal()" class="btn-primary-lg">
                + New Workflow Task
            </button>
        </div>
    </div>

    <!-- Create/Edit Workflow Modal -->
    <div *ngIf="showCreateModal" class="modal-overlay">
        <div class="modal-content">
            <h2 class="modal-title">{{ isEditing ? 'Edit Task' : 'New Workflow Task' }}</h2>

            <div class="form-stack">
                <div class="form-field">
                    <label class="field-label">Project Name</label>
                    <input [(ngModel)]="newTask.projectName" type="text" class="form-input"
                        placeholder="e.g., Berlin Fiber Deployment">
                </div>

                <div class="form-field">
                    <label class="field-label">Current Step</label>
                    <select [(ngModel)]="newTask.currentStep" class="form-select">
                        <option value="Plan">Plan</option>
                        <option value="Excavation">Excavation</option>
                        <option value="Duct Installation">Duct Installation</option>
                        <option value="Backfill">Backfill</option>
                        <option value="Asphalt">Asphalt</option>
                        <option value="Documentation">Documentation</option>
                    </select>
                </div>

                <div class="form-field">
                    <label class="field-label">Assigned To</label>
                    <input [(ngModel)]="newTask.assignedTo" type="text" class="form-input" placeholder="e.g., John Doe">
                </div>

                <div class="form-field">
                    <label class="field-label">Status</label>
                    <select [(ngModel)]="newTask.status" class="form-select">
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                        <option value="blocked">Blocked</option>
                    </select>
                </div>

                <div class="form-field">
                    <label class="field-label">Due Date</label>
                    <input [(ngModel)]="newTask.dueDate" type="date" class="form-input">
                </div>
            </div>

            <div class="modal-footer">
                <button (click)="closeCreateModal()" class="btn-secondary">Cancel</button>
                <button (click)="saveTask()" class="btn-save" [disabled]="!newTask.projectName">
                    {{ isEditing ? 'Save Changes' : 'Create Task' }}
                </button>
            </div>
        </div>
    </div>
</div>
