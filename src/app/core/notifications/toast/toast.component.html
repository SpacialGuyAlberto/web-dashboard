<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-2">
    <div *ngFor="let toast of toasts"
        class="min-w-[300px] p-4 rounded-lg shadow-lg text-white transform transition-all duration-300 animate-slide-in"
        [ngClass]="{
            'bg-green-600': toast.type === 'success',
            'bg-red-600': toast.type === 'error',
            'bg-blue-600': toast.type === 'info',
            'bg-yellow-500': toast.type === 'warning'
        }">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl">
                    {{ toast.type === 'success' ? '✅' : (toast.type === 'error' ? '❌' : (toast.type === 'warning' ? '⚠️'
                    : 'ℹ️')) }}
                </span>
                <span class="font-medium text-sm">{{ toast.message }}</span>
            </div>
            <button (click)="remove(toast.id!)" class="text-white/80 hover:text-white ml-4">
                ✕
            </button>
        </div>
    </div>
</div>
