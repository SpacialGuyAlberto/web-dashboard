<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-2">
    <div *ngFor="let toast of toasts"
        class="transform transition-all duration-300 animate-slide-in relative"
        [ngClass]="{
            'min-w-[300px] p-4 rounded-lg shadow-lg text-white': toast.type !== 'industrial',
            'w-96 bg-[#16171a] border border-white/10 rounded-xl shadow-2xl p-4 cursor-pointer overflow-hidden group': toast.type === 'industrial',
            'bg-green-600': toast.type === 'success',
            'bg-red-600': toast.type === 'error',
            'bg-blue-600': toast.type === 'info',
            'bg-yellow-500': toast.type === 'warning'
        }">
        
        <!-- Standard Toast -->
        <div *ngIf="toast.type !== 'industrial'" class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-xl">
                    {{ toast.type === 'success' ? '✅' : (toast.type === 'error' ? '❌' : (toast.type === 'warning' ? '⚠️' : 'ℹ️')) }}
                </span>
                <span class="font-medium text-sm">{{ toast.message }}</span>
            </div>
            <button (click)="remove(toast.id!)" class="text-white/80 hover:text-white ml-4">
                ✕
            </button>
        </div>

        <!-- Industrial Toast (for notifications) -->
        <div *ngIf="toast.type === 'industrial'" class="flex flex-col">
            <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold text-white font-mono uppercase tracking-wider line-clamp-1 flex-1 mr-2">{{ toast.title }}</span>
                <span [class]="'text-[9px] px-1.5 py-0.5 rounded border font-mono tracking-widest flex-shrink-0 ' + toast.badgeColor">{{ toast.badge }}</span>
            </div>
            <p class="text-xs text-white/60 leading-relaxed mb-1">{{ toast.message }}</p>
            <button (click)="remove(toast.id!)" class="absolute top-2 right-2 text-white/30 hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>
</div>
