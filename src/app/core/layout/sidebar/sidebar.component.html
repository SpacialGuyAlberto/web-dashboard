<aside
    class="w-64 bg-[#131415] text-white/70 flex flex-col h-full transition-all duration-300 relative z-20">
    <!-- Brand -->
    <div class="p-6 border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="relative w-8 h-8 flex items-center justify-center">
                <div
                    class="w-8 h-8 bg-[#161719] border border-white/10 rounded flex items-center justify-center font-bold text-white shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-[#2fb080] animate-pulse"></span>
                </div>
            </div>
            <span class="font-mono text-sm uppercase tracking-widest text-white/90">QuarkBau</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-2 overflow-y-auto scrollbar-thin scrollbar-thumb-white/10">
        <ng-container *ngFor="let item of filteredGroups">

            <!-- Single Item -->
            <a *ngIf="!item.children" [routerLink]="item.route"
                routerLinkActive="bg-[#1a1b1e] text-white border-l-2 border-[#2fb080]"
                [routerLinkActiveOptions]="{exact: item.route === '/'}"
                class="flex items-center gap-3 px-3 py-2.5 rounded-r-lg hover:bg-white/5 hover:text-white transition-all cursor-pointer group mb-1 border-l-2 border-transparent">
                <span class="group-hover:scale-110 transition-transform opacity-70 group-hover:opacity-100">{{ item.icon }}</span>
                <span class="font-mono text-[11px] uppercase tracking-widest">{{ item.label }}</span>
            </a>

            <!-- Group Item -->
            <div *ngIf="item.children" class="mb-3">
                <button (click)="toggleGroup(item)"
                    class="w-full flex items-center justify-between px-3 py-2.5 text-white/50 hover:text-white hover:bg-white/5 rounded-lg transition-colors group">
                    <div class="flex items-center gap-3">
                        <span class="opacity-70 group-hover:opacity-100 transition-colors">{{ item.icon }}</span>
                        <span class="font-mono text-[11px] uppercase tracking-widest">{{ item.label }}</span>
                    </div>
                    <svg [class.rotate-180]="item.isOpen"
                        class="w-4 h-4 transition-transform duration-200 opacity-50 group-hover:opacity-100" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>

                <!-- Submenu -->
                <div *ngIf="item.isOpen" class="mt-1 ml-4 pl-3 border-l border-white/5 space-y-1 animate-fade-in-down">
                    <a *ngFor="let child of item.children" [routerLink]="child.route"
                        routerLinkActive="text-[#2fb080] bg-[#2fb080]/10"
                        class="flex items-center gap-3 px-3 py-2 rounded-lg text-white/40 hover:text-white hover:bg-white/5 transition-all cursor-pointer">
                        <span class="text-[10px] opacity-70">{{ child.icon }}</span>
                        <span class="font-mono text-[10px] uppercase tracking-widest">{{ child.label }}</span>
                    </a>
                </div>
            </div>

        </ng-container>
    </nav>

    <!-- User & Actions -->
    <div class="p-4 border-t border-white/5 bg-[#131415]">
        <div *ngIf="currentUser" class="mb-4 px-2">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded bg-[#1a1b1e] flex items-center justify-center text-xs font-mono uppercase text-white border border-white/10 shadow-sm">
                    {{ currentUser.firstName.charAt(0) }}{{ currentUser.lastName.charAt(0) }}
                </div>
                <div class="overflow-hidden">
                    <div class="text-xs font-mono uppercase tracking-wider text-white truncate">{{ currentUser.firstName }} {{
                        currentUser.lastName }}</div>
                    <div class="text-[9px] font-mono text-[#2fb080] truncate">{{ currentUser.role }}</div>
                </div>
            </div>
        </div>

        <button (click)="logout()"
            class="w-full flex items-center gap-3 px-3 py-2 text-red-400 hover:bg-red-500/10 hover:text-red-300 rounded-lg transition-colors text-[10px] font-mono uppercase tracking-widest">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                </path>
            </svg>
            Logout session
        </button>
    </div>
</aside>
