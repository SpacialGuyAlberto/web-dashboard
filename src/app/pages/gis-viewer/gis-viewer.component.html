<div class="gis-container">
    <!-- Header/Toolbar -->
    <div class="gis-toolbar">
        <div class="brand-block">
            <h1 class="brand-title">
                <span class="brand-icon">🌐</span> Digital Plan Room
            </h1>
            <select (change)="onProjectSelect($event)" class="project-selector">
                <option *ngFor="let p of projects" [value]="p.id">{{p.name}}</option>
            </select>
        </div>
        <div class="toolbar-actions">
            <button (click)="togglePlanOverlay(!showPlanOverlay)" class="btn-toggle-overlay"
                [class.btn-overlay-active]="showPlanOverlay" [class.btn-overlay-inactive]="!showPlanOverlay">
                {{ showPlanOverlay ? 'Hide Utility Plans' : 'Show Utility Plans' }}
            </button>
        </div>
    </div>

    <!-- Map Container -->
    <div class="map-view-container">
        <div *ngIf="isLoading" class="map-loading-overlay">
            <div class="map-spinner"></div>
        </div>

        <google-map height="100%" width="100%" [center]="center" [zoom]="zoom" [options]="mapOptions"
            class="block w-full h-full">
            <!-- Ground Overlay for Utility Plan -->
            <map-ground-overlay *ngIf="showPlanOverlay" [url]="planUrl" [bounds]="planBounds"
                [clickable]="false"></map-ground-overlay>
        </google-map>

        <!-- Legend Overlay -->
        <div class="gis-legend">
            <h3 class="legend-title">Utility Legend</h3>
            <div class="legend-list">
                <div class="legend-item">
                    <div class="utility-indicator indicator-gas"></div>
                    <span class="legend-label">Gas Lines (Vattenfall)</span>
                </div>
                <div class="legend-item">
                    <div class="utility-indicator indicator-water"></div>
                    <span class="legend-label">Water Main (Berlin Wasser)</span>
                </div>
                <div class="legend-item">
                    <div class="utility-indicator indicator-fiber"></div>
                    <span class="legend-label">Fiber Optic (Telekom)</span>
                </div>
            </div>
            <div class="legend-footer">
                <p class="footer-text">
                    Source: Combined VZ/GisData Infrastructure Feed (Updated 2026)
                </p>
            </div>
        </div>
    </div>
</div>
