<div class="min-h-screen flex bg-slate-900">
    <!-- Left Side: Hero Image & Branding (Hidden on mobile) -->
    <div class="hidden lg:flex lg:w-1/2 relative overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-1000 hover:scale-105"
            style="background-image: url('/assets/fiber-hero.png');">
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-slate-900/60 to-transparent"></div>
        <div class="relative z-10 flex flex-col justify-end p-12 text-white h-full">
            <h1 class="text-5xl font-bold mb-4 tracking-tight leading-tight">
                Construyendo el futuro<br>
                <span class="text-blue-500">con precisión.</span>
            </h1>
            <p class="text-xl text-slate-300 max-w-lg leading-relaxed">
                Gestión integral de obras, planificación inteligente y seguridad avanzada en una sola plataforma.
            </p>
            <div class="mt-8 flex space-x-2">
                <div class="h-1 w-12 bg-blue-500 rounded-full"></div>
                <div class="h-1 w-4 bg-slate-600 rounded-full"></div>
                <div class="h-1 w-4 bg-slate-600 rounded-full"></div>
            </div>
        </div>
    </div>

    <!-- Right Side: Login Form with Glassmorphism -->
    <div class="w-full lg:w-1/2 relative flex items-center justify-center p-4 sm:p-8 overflow-hidden">
        <!-- Vibrant Background Layer -->
        <div class="absolute inset-0 z-0">
            <!-- Image at full opacity, dimmed slightly by overlay -->
            <div class="absolute inset-0 bg-cover bg-center bg-no-repeat transform scale-105"
                style="background-image: url('/assets/fiber-cables.png');">
            </div>
            <!-- Gradient Overlay: Transparent at center, darker at edges for focus -->
            <div class="absolute inset-0 bg-radial-gradient from-slate-900/40 via-slate-900/60 to-slate-900/90"></div>
        </div>

        <!-- Glass Login Card -->
        <div
            class="relative z-10 w-full max-w-md bg-slate-900/60 backdrop-blur-xl border border-slate-700/50 rounded-3xl shadow-2xl p-8 sm:p-10 transition-all duration-300 hover:shadow-blue-500/10 hover:border-slate-600/50">
            <!-- Header -->
            <div class="text-center mb-8">
                <div
                    class="inline-flex items-center justify-center p-3 rounded-2xl bg-white/5 border border-white/10 mb-6 shadow-inner">
                    <svg class="w-8 h-8 text-cyan-400 drop-shadow-[0_0_10px_rgba(34,211,238,0.5)]" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                        </path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-white tracking-tight relative">
                    <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">QuarkBau</span>
                </h2>
                <p class="mt-2 text-slate-400 text-sm">
                    Accede a tu panel de control
                </p>
            </div>

            <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="space-y-4">
                    <!-- Email Input -->
                    <div class="space-y-1">
                        <label for="email-address"
                            class="block text-xs font-medium text-slate-300 ml-1 uppercase tracking-wider">Email</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-slate-500 group-focus-within:text-cyan-400 transition-colors"
                                    xmlns="http://www.w3.org/2001/svg" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                                    <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                                </svg>
                            </div>
                            <input id="email-address" type="email" formControlName="email"
                                class="block w-full pl-10 pr-3 py-3 border border-slate-700/50 rounded-xl bg-slate-900/50 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all duration-300 sm:text-sm shadow-inner"
                                placeholder="tu@email.com"
                                [ngClass]="{ 'border-red-500/50 focus:ring-red-500/50': submitted && f['email'].errors }">
                        </div>
                        <div *ngIf="submitted && f['email'].errors" class="text-red-400 text-xs ml-1 flex items-center">
                            <span *ngIf="f['email'].errors['required']">Campo requerido</span>
                            <span *ngIf="f['email'].errors['email']">Email inválido</span>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="space-y-1">
                        <label for="password"
                            class="block text-xs font-medium text-slate-300 ml-1 uppercase tracking-wider">Contraseña</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-slate-500 group-focus-within:text-cyan-400 transition-colors"
                                    xmlns="http://www.w3.org/2001/svg" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd"
                                        d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"
                                        clip-rule="evenodd" />
                                </svg>
                            </div>
                            <input id="password" type="password" formControlName="password"
                                class="block w-full pl-10 pr-3 py-3 border border-slate-700/50 rounded-xl bg-slate-900/50 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500/50 transition-all duration-300 sm:text-sm shadow-inner"
                                placeholder="••••••••"
                                [ngClass]="{ 'border-red-500/50 focus:ring-red-500/50': submitted && f['password'].errors }">
                        </div>
                        <div *ngIf="submitted && f['password'].errors" class="text-red-400 text-xs ml-1">
                            <span *ngIf="f['password'].errors['required']">Campo requerido</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between pt-2">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox"
                            class="h-4 w-4 text-cyan-500 focus:ring-cyan-500 border-slate-600 rounded bg-slate-800">
                        <label for="remember-me"
                            class="ml-2 block text-sm text-slate-300 hover:text-white cursor-pointer transition-colors">Recordarme</label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-cyan-400 hover:text-cyan-300 transition-colors">
                            ¿Recuperar clave?
                        </a>
                    </div>
                </div>

                <!-- Error Message -->
                <div *ngIf="error"
                    class="bg-red-500/10 border border-red-500/30 text-red-300 px-4 py-3 rounded-xl flex items-center text-sm"
                    role="alert">
                    <svg class="w-5 h-5 mr-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>{{ error }}</span>
                </div>

                <!-- Submit Button -->
                <button type="submit" [disabled]="loading"
                    class="group relative w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-slate-900 focus:ring-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-300 shadow-lg shadow-cyan-900/20 hover:shadow-cyan-500/30 hover:-translate-y-0.5">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg *ngIf="!loading" class="h-5 w-5 text-cyan-100 group-hover:text-white transition-colors"
                            xmlns="http://www.w3.org/2001/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                                clip-rule="evenodd" />
                        </svg>
                        <svg *ngIf="loading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2001/svg"
                            fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor"
                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                            </path>
                        </svg>
                    </span>
                    {{ loading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
                </button>

                <div class="text-center pt-2">
                    <p class="text-sm text-slate-400">
                        ¿Nuevo usuario?
                        <a routerLink="/register"
                            class="font-medium text-cyan-400 hover:text-cyan-300 transition-colors">
                            Crear cuenta
                        </a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</div>
